[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-inductor-duplicate-index-writeorder-guard"
version = "0.1.0"
description = "Guards a real torch.compile(Inductor) bug: advanced-indexing read-modify-write assignment (v[idx] = v[idx] + delta) silently drops/reorders one of two logically-independent writes when idx is a COMPUTED duplicate index, e.g. torch.arange(n) % 2 (pytorch/pytorch#197582)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "zhuhroscar-tech" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
torch = ["torch>=2.0"]

[project.scripts]
torch-inductor-duplicate-index-writeorder-guard = "torch_inductor_duplicate_index_writeorder_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
